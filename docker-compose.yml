services:
  db:
    image: postgres:17-alpine
    container_name: gcs-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gcs
      POSTGRES_PASSWORD: gcs
      POSTGRES_DB: gcs_crm
    # 5433 on the host — 5432 is taken by another project's container.
    ports:
      - "5433:5432"
    volumes:
      - gcs-crm-pgdata:/var/lib/postgresql/data

  # Stands in for Backblaze B2 locally — same S3 API, so the app code is identical.
  storage:
    image: quay.io/minio/minio:latest
    container_name: gcs-crm-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gcsminio
      MINIO_ROOT_PASSWORD: gcsminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gcs-crm-minio:/data

volumes:
  gcs-crm-pgdata:
  gcs-crm-minio:
